<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Gym Tracker</title>
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#1D6FA5" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Gym Tracker" />
<link rel="apple-touch-icon" href="icon.svg" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<style>
  @import url('https://fonts.googleapis.com/css2?family=Lexend:wght@500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap');
  :root {
    --bg: #F3F7F5; --surface: #FFFFFF; --surface-alt: #EAF2ED;
    --text: #101B15; --text-muted: #62766B;
    --blue: #1D6FA5; --blue-soft: #DCEBF5;
    --green: #2E9E5B; --green-soft: #DFF3E6;
    --gold: #C98A1F; --gold-soft: #FBEDD1;
    --border: #DBE5DF; --danger: #C4453F;
    --shadow: 0 1px 2px rgba(16,27,21,0.04), 0 4px 14px rgba(16,27,21,0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0C1310; --surface: #141F19; --surface-alt: #1A2721;
      --text: #E8F1EB; --text-muted: #8CA398;
      --blue: #58ABE0; --blue-soft: #1B3348;
      --green: #4ADE80; --green-soft: #17331F;
      --gold: #F2BE5C; --gold-soft: #3A2E14;
      --border: #253229; --danger: #E5726C;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 4px 18px rgba(0,0,0,0.35);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); overflow-x: hidden; }
  body { font-family: 'Inter', sans-serif; color: var(--text); }
  .disp { font-family: 'Lexend', sans-serif; }
  .mono { font-family: 'JetBrains Mono', monospace; font-variant-numeric: tabular-nums; }
  #app { min-height: 100vh; width: 100%; max-width: 480px; margin: 0 auto; position: relative; padding-bottom: 84px; }
  .scroll::-webkit-scrollbar { display: none; }
  .scroll { -ms-overflow-style: none; scrollbar-width: none; }
  @keyframes pop { 0%{transform:scale(.4) translateY(6px);opacity:0;} 55%{transform:scale(1.08) translateY(0);opacity:1;} 100%{transform:scale(1) translateY(0);opacity:1;} }
  @keyframes fadeup { 0%{opacity:0;transform:translateY(8px);} 100%{opacity:1;transform:translateY(0);} }
  .pr-pop { animation: pop .35s cubic-bezier(.2,1.4,.4,1) both; }
  .fadeup { animation: fadeup .25s ease both; }
  input, select, button, textarea { font-family: inherit; }
  input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance:none; margin:0; }
  input[type=number] { -moz-appearance: textfield; }
  button { -webkit-tap-highlight-color: transparent; }
  a { color: inherit; }

  .topbar { position: sticky; top: 0; z-index: 10; background: var(--bg); display: flex; align-items: center; justify-content: space-between; padding: calc(18px + env(safe-area-inset-top)) 20px 12px; gap: 12px; }
  .topbar-left { display: flex; align-items: center; gap: 10px; }
  .topbar h1 { font-size: 20px; font-weight: 700; margin: 0; }
  .icon-btn { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--text); }
  .btn-primary { background: var(--blue); color: #fff; border: none; border-radius: 12px; padding: 11px 18px; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-secondary { background: var(--surface); color: var(--text); border: 1px solid var(--border); border-radius: 12px; padding: 11px 18px; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .btn-danger { background: var(--danger); color: #fff; border: none; border-radius: 12px; padding: 11px 18px; font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .field-label { display: block; font-size: 12.5px; font-weight: 600; color: var(--text-muted); margin: 14px 0 6px; }
  .text-input { width: 100%; max-width: 100%; min-width: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; font-size: 14px; color: var(--text); }
  input[type=date] { width: 100%; max-width: 100%; min-width: 0; box-sizing: border-box; }
  .num-input { width: 100%; background: var(--surface-alt); border: 1px solid var(--border); border-radius: 8px; padding: 7px 6px; font-size: 13px; color: var(--text); text-align: center; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 14px; box-shadow: var(--shadow); }
  .empty-state { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 60px 30px; gap: 10px; }
  .empty-icon { width: 56px; height: 56px; border-radius: 16px; background: var(--surface-alt); display: flex; align-items: center; justify-content: center; margin-bottom: 6px; font-size: 26px; }
  .bottomnav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: var(--surface); border-top: 1px solid var(--border); display: flex; padding: 8px 6px calc(8px + env(safe-area-inset-bottom)); z-index: 20; }
  .bottomnav button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: none; cursor: pointer; padding: 6px 0; color: var(--text-muted); font-size: 11px; }
  .bottomnav button.active { color: var(--blue); font-weight: 600; }
  .bottomnav .nav-icon { font-size: 19px; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(10,14,12,0.5); z-index: 30; display: flex; align-items: flex-end; justify-content: center; }
  .modal-overlay.center { align-items: center; padding: 24px; }
  .modal-sheet { background: var(--surface); width: 100%; max-width: 480px; border-radius: 20px 20px 0 0; padding: 20px; max-height: 80vh; overflow-y: auto; }
  .modal-box { background: var(--surface); border-radius: 18px; padding: 20px; width: 100%; max-width: 340px; box-shadow: var(--shadow); }
  .pill { flex-shrink: 0; padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; border: 1px solid var(--border); cursor: pointer; background: var(--surface); color: var(--text); }
  .pill.active { background: var(--blue); color: #fff; border-color: var(--blue); }
  .save-indicator { position: absolute; top: calc(8px + env(safe-area-inset-top)); right: 14px; z-index: 25; font-size: 11px; color: var(--text-muted); display: flex; align-items: center; gap: 4px; }
</style>
</head>
<body>
<div id="app"></div>

<script>
"use strict";

/* ---------------------------------------------------------
   UTILIDADES
--------------------------------------------------------- */
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const todayISO = () => new Date().toISOString().slice(0, 10);
const fmtDateShort = (iso) => new Date(iso + "T00:00:00").toLocaleDateString("es-AR", { day: "2-digit", month: "short" });
const fmtDateLong = (iso) => new Date(iso + "T00:00:00").toLocaleDateString("es-AR", { day: "2-digit", month: "long", year: "numeric" });
const daysBetween = (a, b) => Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 86400000);
const DAY_LABELS = ["Día 1", "Día 2", "Día 3", "Día 4", "Día 5"];
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function weekLabelFor(session, routine) {
  if (!routine) return "";
  const diff = daysBetween(routine.startDate, session.date);
  const weekNum = Math.max(1, Math.floor(diff / 7) + 1);
  const weekStart = new Date(routine.startDate + "T00:00:00");
  weekStart.setDate(weekStart.getDate() + (weekNum - 1) * 7);
  const weekEnd = new Date(weekStart);
  weekEnd.setDate(weekEnd.getDate() + 6);
  const f = (d) => d.toLocaleDateString("es-AR", { day: "2-digit", month: "short" });
  return `Semana ${weekNum}: ${f(weekStart)} – ${f(weekEnd)}`;
}
function parsePrefillReps(repRange) {
  if (!repRange) return "";
  const m = String(repRange).match(/\d+/);
  return m ? m[0] : "";
}

/* ---------------------------------------------------------
   PERSISTENCIA (localStorage)
--------------------------------------------------------- */
const STORAGE_KEY = "gym-tracker-data-v1";
const emptyData = () => ({ exercises: [], routines: [], sessions: [] });
function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : emptyData();
  } catch (e) { return emptyData(); }
}
function saveData(data) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    flashSaved();
  } catch (e) {
    flashSaved(true);
  }
}
let saveFlashTimer = null;
function flashSaved(isError) {
  const el = document.getElementById("save-indicator");
  if (!el) return;
  el.textContent = isError ? "Error al guardar" : "✓ Guardado";
  el.style.color = isError ? "var(--danger)" : "var(--text-muted)";
  clearTimeout(saveFlashTimer);
  saveFlashTimer = setTimeout(() => { if (el) el.textContent = ""; }, 1500);
}

/* ---------------------------------------------------------
   ESTADO GLOBAL
--------------------------------------------------------- */
const state = {
  data: loadData(),
  screen: "home",
  logTarget: null,      // { routineId, dayId }
  logEntries: null,     // working copy while logging a session
  prFlash: {},           // "entryIdx-setIdx" -> true
  routineEditor: null,   // working draft for new routine
  exercisePicker: null,  // { dayIdx, step, selected, search }
  statsView: "charts",
  statsSelectedId: null,
  historyDayFilter: "all",
  historyOpenId: null,
  archiveOpenId: null,
  confirmModal: null,    // { title, message, onConfirm }
};

function persist(next) {
  state.data = next;
  saveData(next);
}

/* ---------------------------------------------------------
   HELPERS DE DOMINIO
--------------------------------------------------------- */
function getActiveRoutine(data) { return data.routines.find((r) => r.active) || null; }
function getArchivedRoutines(data) { return data.routines.filter((r) => !r.active).sort((a, b) => (a.startDate < b.startDate ? 1 : -1)); }
function findExercise(data, id) { return data.exercises.find((e) => e.id === id); }
function lastEntryForPlanned(data, plannedId, excludeSessionId) {
  const sessions = data.sessions.filter((s) => s.id !== excludeSessionId).sort((a, b) => (a.date < b.date ? 1 : -1));
  for (const s of sessions) {
    const entry = s.entries.find((e) => e.plannedExerciseId === plannedId);
    if (entry && entry.sets.length > 0) return entry;
  }
  return null;
}
function maxWeightInEntry(entry) {
  if (!entry || !entry.sets.length) return 0;
  return Math.max(...entry.sets.map((s) => Number(s.weight) || 0));
}
function bestWeightForPlanned(data, plannedId, excludeSessionId) {
  const sessions = data.sessions.filter((s) => s.id !== excludeSessionId);
  let best = 0;
  for (const s of sessions) {
    const entry = s.entries.find((e) => e.plannedExerciseId === plannedId);
    if (entry) best = Math.max(best, maxWeightInEntry(entry));
  }
  return best;
}
function deleteRoutine(routineId) {
  const routines = state.data.routines.filter((r) => r.id !== routineId);
  const sessions = state.data.sessions.filter((s) => s.routineId !== routineId);
  persist({ ...state.data, routines, sessions });
}

/* ---------------------------------------------------------
   ICONOS
--------------------------------------------------------- */
const I = {
  flame: "🔥", trophy: "🏆", plus: "+", check: "✓", chevronRight: "›",
  dumbbell: "🏋️‍♀️", trending: "📈", archive: "🗂️", x: "✕", pencil: "✏️",
  trash: "🗑️", home: "🏠", chart: "📊", list: "📋", save: "💾", arrowLeft: "←",
};

/* ---------------------------------------------------------
   GRÁFICO SVG SIMPLE
--------------------------------------------------------- */
function miniLineChartSVG(data, dataKey, color, unit) {
  const width = 320, height = 190, padX = 26, padTop = 26, padBottom = 26;
  const values = data.map((d) => d[dataKey]);
  const min = Math.min(...values), max = Math.max(...values);
  const range = max - min || 1;
  const innerW = width - padX * 2;
  const innerH = height - padTop - padBottom;
  const stepX = data.length > 1 ? innerW / (data.length - 1) : 0;
  const points = data.map((d, i) => ({ x: padX + i * stepX, y: padTop + innerH - ((d[dataKey] - min) / range) * innerH, ...d }));
  const path = points.map((p, i) => (i === 0 ? "M" : "L") + p.x.toFixed(1) + "," + p.y.toFixed(1)).join(" ");
  const gridLines = [0, 0.5, 1].map((f) => `<line x1="${padX}" x2="${width - padX}" y1="${padTop + f * innerH}" y2="${padTop + f * innerH}" stroke="var(--border)" stroke-width="1" />`).join("");
  const dots = points.map((p) => `
    <circle cx="${p.x}" cy="${p.y}" r="3.5" fill="${color}" />
    <text x="${p.x}" y="${p.y - 9}" font-size="9" text-anchor="middle" fill="var(--text)" font-family="'JetBrains Mono', monospace" font-weight="600">${esc(p[dataKey])}${unit}</text>
    <text x="${p.x}" y="${height - 8}" font-size="8.5" text-anchor="middle" fill="var(--text-muted)">${esc(p.dateLabel)}</text>
  `).join("");
  return `<svg viewBox="0 0 ${width} ${height}" style="width:100%;height:auto;display:block;">${gridLines}<path d="${path}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />${dots}</svg>`;
}

/* ---------------------------------------------------------
   RENDER: SHELL
--------------------------------------------------------- */
function render() {
  const app = document.getElementById("app");
  let content = "";
  if (state.screen === "home") content = renderHome();
  else if (state.screen === "log") content = renderLog();
  else if (state.screen === "routine") content = renderRoutine();
  else if (state.screen === "stats") content = renderStats();
  else if (state.screen === "archive") content = renderArchive();

  app.innerHTML = `
    <div id="save-indicator" class="save-indicator"></div>
    ${content}
    ${renderBottomNav()}
    ${state.exercisePicker ? renderExercisePickerModal() : ""}
    ${state.confirmModal ? renderConfirmModal() : ""}
  `;
  wireGlobalHandlers();
}

function renderBottomNav() {
  const items = [
    { key: "home", label: "Inicio", icon: "home" },
    { key: "routine", label: "Rutina", icon: "list" },
    { key: "stats", label: "Progreso", icon: "chart" },
    { key: "archive", label: "Archivo", icon: "archive" },
  ];
  return `<div class="bottomnav">${items.map((it) => {
    const active = state.screen === it.key || (state.screen === "log" && it.key === "home");
    return `<button data-nav="${it.key}" class="${active ? "active" : ""}"><span class="nav-icon">${I[it.icon]}</span><span>${it.label}</span></button>`;
  }).join("")}</div>`;
}

function topBar(title, opts) {
  opts = opts || {};
  return `<div class="topbar">
    <div class="topbar-left">
      ${opts.back ? `<button class="icon-btn" data-action="back">${I.arrowLeft}</button>` : ""}
      <h1 class="disp">${esc(title)}</h1>
    </div>
    ${opts.right || ""}
  </div>`;
}

function emptyState(icon, title, subtitle, actionHtml) {
  return `<div class="empty-state fadeup">
    <div class="empty-icon">${I[icon]}</div>
    <div class="disp" style="font-size:17px;font-weight:700;">${esc(title)}</div>
    <div style="font-size:14px;color:var(--text-muted);line-height:1.5;">${esc(subtitle)}</div>
    ${actionHtml || ""}
  </div>`;
}

/* ---------------------------------------------------------
   PANTALLA: HOME
--------------------------------------------------------- */
function renderHome() {
  const routine = getActiveRoutine(state.data);
  if (!routine) {
    return topBar("Tu rutina") + emptyState("dumbbell", "Todavía no armaste una rutina",
      "Cargá tus 5 días con ejercicios, series, reps y RPE para empezar a registrar tus entrenamientos.",
      `<button class="btn-primary" data-action="go-routine">${I.plus} Crear rutina</button>`);
  }
  const weekNum = Math.max(1, Math.floor(daysBetween(routine.startDate, todayISO()) / 7) + 1);
  const daysHtml = routine.days.map((day, idx) => {
    const lastSession = state.data.sessions.filter((s) => s.dayId === day.id).sort((a, b) => (a.date < b.date ? 1 : -1))[0];
    return `<button class="fadeup" data-action="go-log" data-routine-id="${routine.id}" data-day-id="${day.id}"
      style="display:flex;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:14px 16px;cursor:pointer;box-shadow:var(--shadow);text-align:left;width:100%;animation-delay:${idx * 40}ms;">
      <div style="display:flex;align-items:center;gap:12px;">
        <div style="width:40px;height:40px;border-radius:12px;background:var(--green-soft);display:flex;align-items:center;justify-content:center;color:var(--green);font-weight:700;font-family:Lexend;">${idx + 1}</div>
        <div>
          <div class="disp" style="font-weight:600;font-size:15px;">${esc(day.label)}</div>
          <div style="font-size:12px;color:var(--text-muted);">${day.exercises.length} ejercicio${day.exercises.length !== 1 ? "s" : ""}${lastSession ? ` · último ${fmtDateShort(lastSession.date)}` : " · sin registros"}</div>
        </div>
      </div>
      <span style="color:var(--text-muted);">${I.chevronRight}</span>
    </button>`;
  }).join("");

  return topBar("Hoy entrenás") + `
    <div style="padding:0 20px 8px;">
      <div class="fadeup" style="background:var(--blue-soft);border-radius:16px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;">
        <div>
          <div class="disp" style="font-weight:700;font-size:15px;">${esc(routine.name)}</div>
          <div style="font-size:12.5px;color:var(--text-muted);margin-top:2px;">Semana ${weekNum} · desde ${fmtDateShort(routine.startDate)}</div>
        </div>
        <span style="font-size:22px;">${I.flame}</span>
      </div>
      <div style="font-size:13px;font-weight:600;color:var(--text-muted);margin-bottom:10px;text-transform:uppercase;letter-spacing:0.4px;">Elegí tu día</div>
      <div style="display:flex;flex-direction:column;gap:10px;">${daysHtml}</div>
    </div>
  `;
}

/* ---------------------------------------------------------
   PANTALLA: REGISTRO DE SESIÓN
--------------------------------------------------------- */
function ensureLogEntries() {
  if (state.logEntries) return;
  const { routineId, dayId } = state.logTarget;
  const routine = state.data.routines.find((r) => r.id === routineId);
  const day = routine?.days.find((d) => d.id === dayId);
  const existingSession = state.data.sessions.find((s) => s.dayId === dayId && s.date === todayISO());
  state.logEntries = (day?.exercises || []).map((planned) => {
    const existingEntry = existingSession?.entries.find((e) => e.plannedExerciseId === planned.id);
    if (existingEntry) return JSON.parse(JSON.stringify(existingEntry));
    const lastEntry = lastEntryForPlanned(state.data, planned.id, existingSession?.id);
    const lastWeight = lastEntry ? maxWeightInEntry(lastEntry) : "";
    const sets = Array.from({ length: planned.sets }).map((_, i) => ({
      setNumber: i + 1, weight: lastWeight || "", reps: parsePrefillReps(planned.repRange), rpe: planned.rpe || "",
    }));
    return { plannedExerciseId: planned.id, exerciseId: planned.exerciseId, sets };
  });
}

function renderLog() {
  const { routineId, dayId } = state.logTarget || {};
  const routine = state.data.routines.find((r) => r.id === routineId);
  const day = routine?.days.find((d) => d.id === dayId);
  if (!routine || !day) return topBar("Registro", { back: true }) + emptyState("dumbbell", "No encontramos ese día", "Volvé al inicio e intentá de nuevo.");

  ensureLogEntries();

  const exercisesHtml = day.exercises.map((planned, entryIdx) => {
    const exercise = findExercise(state.data, planned.exerciseId);
    const entry = state.logEntries[entryIdx];
    const setsHtml = entry.sets.map((set, setIdx) => {
      const key = `${entryIdx}-${setIdx}`;
      const showPr = !!state.prFlash[key];
      return `<div style="position:relative;display:grid;grid-template-columns:24px 1fr 1fr 1fr 24px;gap:6px;margin-bottom:6px;align-items:center;">
        <div class="mono" style="font-size:12px;color:var(--text-muted);text-align:center;">${set.setNumber}</div>
        <div style="position:relative;">
          <input class="num-input" type="number" inputmode="decimal" value="${esc(set.weight)}" data-role="weight" data-entry="${entryIdx}" data-set="${setIdx}" />
          ${showPr ? `<div class="pr-pop" style="position:absolute;right:-6px;top:-22px;display:flex;align-items:center;gap:2px;">
            <span style="font-size:9.5px;font-weight:700;color:var(--gold);background:var(--gold-soft);padding:2px 5px;border-radius:6px;white-space:nowrap;display:flex;align-items:center;gap:2px;">${I.trophy} ¡PR!</span>
          </div>` : ""}
        </div>
        <input class="num-input" type="number" inputmode="decimal" value="${esc(set.reps)}" data-role="reps" data-entry="${entryIdx}" data-set="${setIdx}" />
        <input class="num-input" type="number" inputmode="decimal" value="${esc(set.rpe)}" data-role="rpe" data-entry="${entryIdx}" data-set="${setIdx}" />
        <button data-action="remove-set" data-entry="${entryIdx}" data-set="${setIdx}" style="background:none;border:none;color:var(--text-muted);cursor:pointer;padding:2px;">${I.x}</button>
      </div>`;
    }).join("");

    return `<div class="card">
      <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;">
        <div class="disp" style="font-weight:700;font-size:15px;">${esc(exercise?.name)}</div>
        <div class="mono" style="font-size:11.5px;color:var(--text-muted);">${planned.sets}×${esc(planned.repRange)} · RPE ${planned.rpe}</div>
      </div>
      <div style="display:grid;grid-template-columns:24px 1fr 1fr 1fr 24px;gap:6px;font-size:10.5px;color:var(--text-muted);margin-bottom:4px;font-weight:600;">
        <div>#</div><div>Peso (kg)</div><div>${planned.isTimed ? "Seg" : "Reps"}</div><div>RPE</div><div></div>
      </div>
      ${setsHtml}

/* ---------------------------------------------------------
   PANTALLA: PROGRESO
--------------------------------------------------------- */
function getExercisesWithData() {
  const ids = new Set();
  state.data.sessions.forEach((s) => s.entries.forEach((e) => { if (e.sets.length > 0) ids.add(e.exerciseId); }));
  return state.data.exercises.filter((e) => ids.has(e.id));
}
function getChartData(exerciseId) {
  const points = [];
  state.data.sessions.slice().sort((a, b) => (a.date < b.date ? -1 : 1)).forEach((session) => {
    const relevant = session.entries.filter((e) => e.exerciseId === exerciseId && e.sets.length > 0);
    if (relevant.length === 0) return;
    let maxWeight = 0, volume = 0;
    relevant.forEach((entry) => entry.sets.forEach((s) => { maxWeight = Math.max(maxWeight, s.weight); volume += s.weight * s.reps; }));
    const routine = state.data.routines.find((r) => r.id === session.routineId);
    points.push({ date: session.date, dateLabel: fmtDateShort(session.date), maxWeight, volume, weekLabel: weekLabelFor(session, routine), routineName: routine?.name || "" });
  });
  return points;
}

function renderStats() {
  const hasAnySessions = state.data.sessions.some((s) => s.entries.some((e) => e.sets.length > 0));
  if (!hasAnySessions) return topBar("Progreso") + emptyState("trending", "Todavía no hay datos", "Registrá al menos una sesión para empezar a ver tu evolución y tu historial acá.");

  const toggle = `<div style="display:flex;background:var(--surface-alt);border-radius:12px;padding:4px;margin-bottom:14px;gap:4px;">
    <button data-action="stats-view" data-view="charts" style="flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 0;border-radius:9px;border:none;cursor:pointer;font-size:13px;font-weight:600;background:${state.statsView === "charts" ? "var(--surface)" : "transparent"};color:${state.statsView === "charts" ? "var(--text)" : "var(--text-muted)"};box-shadow:${state.statsView === "charts" ? "var(--shadow)" : "none"};">${I.trending} Gráficos</button>
    <button data-action="stats-view" data-view="history" style="flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 0;border-radius:9px;border:none;cursor:pointer;font-size:13px;font-weight:600;background:${state.statsView === "history" ? "var(--surface)" : "transparent"};color:${state.statsView === "history" ? "var(--text)" : "var(--text-muted)"};box-shadow:${state.statsView === "history" ? "var(--shadow)" : "none"};">${I.list} Historial</button>
  </div>`;

  let body = "";
  if (state.statsView === "charts") {
    const exercisesWithData = getExercisesWithData();
    if (exercisesWithData.length === 0) {
      body = `<div style="font-size:13px;color:var(--text-muted);padding:30px 4px;text-align:center;">Todavía no hay series completas registradas.</div>`;
    } else {
      if (!state.statsSelectedId || !exercisesWithData.find((e) => e.id === state.statsSelectedId)) state.statsSelectedId = exercisesWithData[0].id;
      const chips = exercisesWithData.map((ex) => `<button data-action="select-stat-exercise" data-exercise-id="${ex.id}" class="pill ${ex.id === state.statsSelectedId ? "active" : ""}">${esc(ex.name)}</button>`).join("");
      const chartData = getChartData(state.statsSelectedId);
      const selected = exercisesWithData.find((e) => e.id === state.statsSelectedId);
      body = `<div class="scroll" style="display:flex;gap:8px;overflow-x:auto;padding-bottom:10px;">${chips}</div>`;
      if (chartData.length < 2) {
        body += `<div style="font-size:13px;color:var(--text-muted);padding:30px 4px;text-align:center;">Registrá al menos 2 sesiones de "${esc(selected?.name)}" para ver el gráfico de evolución.</div>`;
      } else {
        body += `<div style="margin-top:18px;"><div class="disp" style="font-weight:700;font-size:14.5px;margin-bottom:8px;">Peso máximo por sesión</div>
          <div class="card" style="padding:14px 10px 6px;">${miniLineChartSVG(chartData, "maxWeight", "var(--blue)", " kg")}</div></div>`;
        body += `<div style="margin-top:18px;"><div class="disp" style="font-weight:700;font-size:14.5px;margin-bottom:8px;">Volumen total (peso × reps)</div>
          <div class="card" style="padding:14px 10px 6px;">${miniLineChartSVG(chartData, "volume", "var(--green)", "")}</div></div>`;
      }
    }
  } else {
    body = renderHistoryList();
  }

  return topBar("Progreso") + `<div style="padding:0 20px;">${toggle}${body}</div>`;
}

function renderHistoryList() {
  const dayOptions = new Map();
  state.data.routines.forEach((r) => r.days.forEach((d) => dayOptions.set(d.id, `${d.label} · ${r.name}`)));
  const sessions = state.data.sessions
    .filter((s) => s.entries.some((e) => e.sets.length > 0))
    .filter((s) => state.historyDayFilter === "all" || s.dayId === state.historyDayFilter)
    .sort((a, b) => (a.date < b.date ? 1 : -1));

  const options = `<option value="all">Todos los días</option>` + [...dayOptions.entries()].map(([id, label]) => `<option value="${id}" ${state.historyDayFilter === id ? "selected" : ""}>${esc(label)}</option>`).join("");
  const select = `<select class="text-input" data-role="history-day-filter" style="margin-bottom:14px;font-size:13px;">${options}</select>`;

  if (sessions.length === 0) {
    return select + `<div style="font-size:13px;color:var(--text-muted);padding:24px 4px;text-align:center;">No hay entrenamientos registrados para ese filtro.</div>`;
  }

  const list = sessions.map((session) => {
    const routine = state.data.routines.find((r) => r.id === session.routineId);
    const day = routine?.days.find((d) => d.id === session.dayId);
    const open = state.historyOpenId === session.id;
    const totalSets = session.entries.reduce((acc, e) => acc + e.sets.length, 0);

    let details = "";
    if (open) {
      details = session.entries.filter((e) => e.sets.length > 0).map((entry) => {
        const ex = findExercise(state.data, entry.exerciseId);
        const planned = day?.exercises.find((p) => p.id === entry.plannedExerciseId);
        const setBlocks = entry.sets.map((s) => `<div style="background:var(--surface-alt);border-radius:8px;padding:6px 8px;text-align:center;">
          <div style="font-size:9.5px;color:var(--text-muted);margin-bottom:2px;">Serie ${s.setNumber}</div>
          <div class="mono" style="font-size:12.5px;font-weight:700;">${s.weight}kg</div>
          <div class="mono" style="font-size:10.5px;color:var(--text-muted);">${s.reps}${planned?.isTimed ? "s" : "r"} · RPE ${s.rpe ?? "–"}</div>
        </div>`).join("");
        return `<div style="border-top:1px solid var(--border);padding-top:10px;">
          <div style="display:flex;justify-content:space-between;margin-bottom:6px;">
            <span style="font-weight:600;font-size:13.5px;">${esc(ex?.name)}</span>
            ${planned ? `<span class="mono" style="font-size:11px;color:var(--text-muted);">objetivo: ${planned.sets}×${esc(planned.repRange)} · RPE ${planned.rpe}</span>` : ""}
          </div>
          <div style="display:grid;grid-template-columns:repeat(auto-fill, minmax(70px, 1fr));gap:6px;">${setBlocks}</div>
        </div>`;
      }).join("");
      details = `<div class="fadeup" style="padding:0 14px 14px;display:flex;flex-direction:column;gap:12px;">${details}</div>`;
    }

    return `<div class="card" style="padding:0;overflow:hidden;">
      <button data-action="toggle-history" data-session-id="${session.id}" style="width:100%;background:none;border:none;cursor:pointer;padding:14px;display:flex;justify-content:space-between;align-items:center;">
        <div style="text-align:left;">
          <div class="disp" style="font-weight:700;font-size:14.5px;">${esc(day?.label || "Día eliminado")}</div>
          <div style="font-size:12px;color:var(--text-muted);margin-top:2px;">${fmtDateLong(session.date)} · ${esc(routine?.name || "Rutina archivada")} · ${totalSets} series</div>
        </div>
        <span style="color:var(--text-muted);">${I.chevronRight}</span>
      </button>
      ${details}
    </div>`;
  }).join("");

  return select + `<div style="display:flex;flex-direction:column;gap:10px;">${list}</div>`;
}

/* ---------------------------------------------------------
   EVENTOS
--------------------------------------------------------- */
function wireGlobalHandlers() {
  const app = document.getElementById("app");

  app.querySelectorAll("[data-nav]").forEach((btn) => {
    btn.addEventListener("click", () => {
      state.screen = btn.getAttribute("data-nav");
      if (state.screen !== "log") state.logEntries = null;
      render();
    });
  });

  app.addEventListener("click", handleDelegatedClick);
  app.addEventListener("input", handleDelegatedInput);
  app.addEventListener("change", handleDelegatedInput);
}

function handleDelegatedClick(e) {
  const el = e.target.closest("[data-action]");
  if (!el) return;
  const action = el.getAttribute("data-action");

  if (action === "go-routine") { state.screen = "routine"; render(); }
  else if (action === "back") { state.screen = "home"; state.logEntries = null; render(); }
  else if (action === "go-log") {
    state.logTarget = { routineId: el.getAttribute("data-routine-id"), dayId: el.getAttribute("data-day-id") };
    state.logEntries = null;
    state.prFlash = {};
    state.screen = "log";
    render();
  }
  else if (action === "add-set") {
    const entryIdx = Number(el.getAttribute("data-entry"));
    const entry = state.logEntries[entryIdx];
    const day = getLogDay();
    const planned = day.exercises[entryIdx];
    const lastSet = entry.sets[entry.sets.length - 1];
    entry.sets.push({ setNumber: entry.sets.length + 1, weight: lastSet?.weight || "", reps: parsePrefillReps(planned.repRange), rpe: planned.rpe || "" });
    render();
  }
  else if (action === "remove-set") {
    const entryIdx = Number(el.getAttribute("data-entry"));
    const setIdx = Number(el.getAttribute("data-set"));
    state.logEntries[entryIdx].sets.splice(setIdx, 1);
    state.logEntries[entryIdx].sets.forEach((s, i) => (s.setNumber = i + 1));
    render();
  }
  else if (action === "save-session") { saveSession(); }
  else if (action === "new-routine") { state.routineEditor = null; render(); }
  else if (action === "open-exercise-picker") {
    state.exercisePicker = { dayIdx: Number(el.getAttribute("data-day-idx")), step: "pick", search: "", repRange: "8-12", sets: 4, rpe: 8, isTimed: false };
    render();
  }
  else if (action === "close-exercise-picker" || action === "close-modal-overlay") { state.exercisePicker = null; render(); }
  else if (action === "pick-exercise") {
    state.exercisePicker.selectedId = el.getAttribute("data-exercise-id");
    state.exercisePicker.step = "config";
    render();
  }
  else if (action === "create-exercise") {
    const input = document.getElementById("new-exercise-name-input");
    const name = (input?.value || "").trim();
    if (!name) return;
    const ex = { id: uid(), name };
    persist({ ...state.data, exercises: [...state.data.exercises, ex] });
    state.exercisePicker.selectedId = ex.id;
    state.exercisePicker.step = "config";
    render();
  }
  else if (action === "confirm-add-exercise") {
    const p = state.exercisePicker;
    const dayIdx = p.dayIdx;
    const planned = { id: uid(), exerciseId: p.selectedId, repRange: p.repRange, sets: Number(p.sets), rpe: Number(p.rpe), isTimed: p.isTimed };
    state.routineEditor.days[dayIdx].exercises.push(planned);
    state.exercisePicker = null;
    render();
  }
  else if (action === "remove-planned") {
    const dayIdx = Number(el.getAttribute("data-day-idx"));
    const plannedId = el.getAttribute("data-planned-id");
    state.routineEditor.days[dayIdx].exercises = state.routineEditor.days[dayIdx].exercises.filter((p) => p.id !== plannedId);
    render();
  }
  else if (action === "save-routine") { saveRoutine(); }
  else if (action === "delete-routine") {
    const routineId = el.getAttribute("data-routine-id");
    const sessionCount = Number(el.getAttribute("data-session-count"));
    const name = el.getAttribute("data-routine-name");
    state.confirmModal = {
      title: `¿Eliminar "${name}"?`,
      message: sessionCount > 0 ? `Esto también va a borrar ${sessionCount} entrenamiento${sessionCount !== 1 ? "s" : ""} registrado${sessionCount !== 1 ? "s" : ""} en esta rutina. Esta acción no se puede deshacer.` : "Esta acción no se puede deshacer.",
      routineId,
    };
    render();
  }
  else if (action === "close-confirm-modal") { state.confirmModal = null; render(); }
  else if (action === "confirm-delete") {
    deleteRoutine(state.confirmModal.routineId);
    state.confirmModal = null;
    render();
  }
  else if (action === "stats-view") { state.statsView = el.getAttribute("data-view"); render(); }
  else if (action === "select-stat-exercise") { state.statsSelectedId = el.getAttribute("data-exercise-id"); render(); }
  else if (action === "toggle-history") {
    const id = el.getAttribute("data-session-id");
    state.historyOpenId = state.historyOpenId === id ? null : id;
    render();
  }
  else if (action === "toggle-archive") {
    const id = el.getAttribute("data-routine-id");
    state.archiveOpenId = state.archiveOpenId === id ? null : id;
    render();
  }
}

function getLogDay() {
  const { routineId, dayId } = state.logTarget;
  const routine = state.data.routines.find((r) => r.id === routineId);
  return routine?.days.find((d) => d.id === dayId);
}

function handleDelegatedInput(e) {
  const el = e.target;
  const role = el.getAttribute && el.getAttribute("data-role");
  if (!role) return;

  if (role === "weight" || role === "reps" || role === "rpe") {
    const entryIdx = Number(el.getAttribute("data-entry"));
    const setIdx = Number(el.getAttribute("data-set"));
    state.logEntries[entryIdx].sets[setIdx][role] = el.value;
    if (role === "weight") {
      const day = getLogDay();
      const planned = day.exercises[entryIdx];
      const existingSession = state.data.sessions.find((s) => s.dayId === state.logTarget.dayId && s.date === todayISO());
      const best = bestWeightForPlanned(state.data, planned.id, existingSession?.id);
      const val = Number(el.value) || 0;
      const key = `${entryIdx}-${setIdx}`;
      const wasShown = !!state.prFlash[key];
      const shouldShow = val > 0 && val > best;
      if (shouldShow !== wasShown) {
        if (shouldShow) state.prFlash[key] = true; else delete state.prFlash[key];
        render(); // only re-render on badge state change, preserves focus otherwise
        const input = document.querySelector(`input[data-role="weight"][data-entry="${entryIdx}"][data-set="${setIdx}"]`);
        if (input) { input.focus(); input.setSelectionRange(input.value.length, input.value.length); }
      }
    }
  }
  else if (role === "routine-name") { state.routineEditor.name = el.value; syncSaveRoutineButton(); }
  else if (role === "routine-start-date") { state.routineEditor.startDate = el.value; }
  else if (role === "exercise-search") { state.exercisePicker.search = el.value; render(); document.getElementById("exercise-search-input")?.focus(); }
  else if (role === "planned-repRange") { state.exercisePicker.repRange = el.value; }
  else if (role === "planned-sets") { state.exercisePicker.sets = el.value; }
  else if (role === "planned-rpe") { state.exercisePicker.rpe = el.value; }
  else if (role === "planned-isTimed") { state.exercisePicker.isTimed = el.checked; }
  else if (role === "history-day-filter") { state.historyDayFilter = el.value; render(); }
}

function syncSaveRoutineButton() {
  const btn = document.getElementById("save-routine-btn");
  if (!btn) return;
  const canSave = state.routineEditor.name.trim() && state.routineEditor.days.some((d) => d.exercises.length > 0);
  btn.disabled = !canSave;
}

function saveSession() {
  const { routineId, dayId } = state.logTarget;
  const existingSession = state.data.sessions.find((s) => s.dayId === dayId && s.date === todayISO());
  const cleanEntries = state.logEntries.map((e) => ({
    ...e,
    sets: e.sets.filter((s) => s.weight !== "" || s.reps !== "").map((s) => ({
      setNumber: s.setNumber, weight: Number(s.weight) || 0, reps: Number(s.reps) || 0, rpe: s.rpe === "" ? null : Number(s.rpe),
    })),
  }));
  let sessions;
  if (existingSession) {
    sessions = state.data.sessions.map((s) => (s.id === existingSession.id ? { ...s, entries: cleanEntries } : s));
  } else {
    sessions = [...state.data.sessions, { id: uid(), date: todayISO(), routineId, dayId, entries: cleanEntries }];
  }
  persist({ ...state.data, sessions });
  const msg = document.getElementById("save-session-msg");
  if (msg) {
    msg.style.display = "flex";
    setTimeout(() => { if (msg) msg.style.display = "none"; }, 1800);
  }
}

function saveRoutine() {
  const ed = state.routineEditor;
  if (!ed.name.trim() || !ed.days.some((d) => d.exercises.length > 0)) return;
  const active = getActiveRoutine(state.data);
  let routines = state.data.routines;
  if (active) routines = routines.map((r) => (r.id === active.id ? { ...r, active: false, endDate: todayISO() } : r));
  const newRoutine = { id: uid(), name: ed.name.trim(), startDate: ed.startDate, endDate: null, active: true, days: ed.days };
  persist({ ...state.data, routines: [...routines, newRoutine] });
  state.routineEditor = null;
  render();
}

/* ---------------------------------------------------------
   INICIO
--------------------------------------------------------- */
render();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
